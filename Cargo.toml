[workspace]
resolver = "2"
members = [
    "crates/ss-media",
    "crates/ss-torrent",
    "crates/ss-youtube",
    "crates/ss-remux",
    "ss-worker",
]
# The fork is a dependency, not ours to test: its own suite needs fixtures it
# does not ship. The desktop app is its own workspace, so the worker image and
# the Linux CI never need Tauri's system libraries.
exclude = ["crates/librqbit", "desktop/src-tauri"]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
