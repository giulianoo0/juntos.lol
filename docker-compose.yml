services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        DISCORD_URL: ${DISCORD_URL:-}
    # Without a policy here the host coming back up leaves the site off the
    # air: Docker restarts and starts only the containers that carry one.
    # unless-stopped rather than always, so a deliberate stop during a deploy
    # is still respected.
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1:8099}:8080"
    # The metrics endpoint is exposed to the Compose network and published to
    # nowhere: the collector below is the only thing that reaches it, and the
    # TLS proxy in front of the site never sees it at all.
    expose:
      - "9090"
    environment:
      REDIS_URL: redis://redis:6379
      METRICS_PORT: "9090"
      DATA_DIR: /data
      WEB_DIR: /web
      GIN_MODE: release
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      TRUSTED_EDGE: ${TRUSTED_EDGE:-}
      WORKER_ENROLLMENT_SECRET: ${WORKER_ENROLLMENT_SECRET:-}
      WORKER_SIGNING_KEY_FILE: ${WORKER_SIGNING_KEY_FILE:-/data/worker-signing.key}
      WORKER_RELAY_BASE: ${WORKER_RELAY_BASE:-}
      REMOTE_REMUX: ${REMOTE_REMUX:-}
      REMOTE_REMUX_API_BASE: ${REMOTE_REMUX_API_BASE:-}
    volumes:
      - ss-data:/data
      # The documentation is built from its own repository and rsynced here,
      # so a built site never gets versioned inside this one. Read-only, and
      # optional: the site works without it, /docs just 404s.
      - ./web-docs:/web/docs:ro
    depends_on:
      - redis
      - livekit

  # Scrapes the application and forwards the series to Grafana Cloud. There is
  # deliberately no Prometheus and no Grafana here: the stack in Grafana Cloud
  # is where the series are stored and drawn.
  alloy:
    image: grafana/alloy:latest
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROM_URL: ${GRAFANA_CLOUD_PROM_URL}
      GRAFANA_CLOUD_PROM_USER: ${GRAFANA_CLOUD_PROM_USER}
      GRAFANA_CLOUD_PROM_TOKEN: ${GRAFANA_CLOUD_PROM_TOKEN}
      SS_METRICS_TARGET: app:9090
      SS_INSTANCE: ${SS_INSTANCE:-juntos.lol}
      SS_ENV: ${SS_ENV:-production}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ss-alloy-data:/var/lib/alloy/data
    # Alloy's own diagnostic UI. It listens on all interfaces inside the
    # container because otherwise it is unreachable from outside it, and is
    # published to loopback only, like everything else here.
    ports:
      - "${ALLOY_BIND:-127.0.0.1:12345}:12345"
    depends_on:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # For production, set LIVEKIT_ARGS=--config /etc/livekit.yaml and add the
    # configuration through a Compose override (kept outside version control).
    command: ${LIVEKIT_ARGS:---dev}
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  # The torrent worker: joins swarms and serves the bytes straight to the
  # host's browser over HTTPS on its own port — never through the site's
  # proxy or its CDN, which must not carry torrent traffic. It dials the app
  # over the Compose network and only exists once WORKER_ENROLLMENT_SECRET
  # is set. The :80 ACME challenge is published to loopback for the host's
  # nginx to forward /.well-known/acme-challenge/ to.
  worker:
    build:
      context: ./ss-worker
    restart: unless-stopped
    # Torrent logs are chatty and the default json-file driver never rotates:
    # left alone it fills the host's disk from outside the worker's own quota.
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
    environment:
      SS_WORKER_SERVER_URL: ws://app:8080/ws/worker-link
      SS_WORKER_ENROLLMENT_TOKEN: ${WORKER_ENROLLMENT_SECRET:-}
      SS_WORKER_DATA_DIR: /var/lib/ss-worker
      SS_WORKER_TLS: ${WORKER_TLS:-acme}
      SS_WORKER_PUBLIC_IP: ${WORKER_PUBLIC_IP:-}
      SS_WORKER_HTTPS_ADDR: "[::]:8443"
      SS_WORKER_HTTP_ADDR: "[::]:8081"
      SS_WORKER_BT_PORT: "4240"
      SS_WORKER_DISK_QUOTA_GB: ${WORKER_DISK_QUOTA_GB:-35}
      SS_WORKER_TRANSFER_MBIT: ${WORKER_TRANSFER_MBIT:-0}
      SS_WORKER_MAX_LEASES: ${WORKER_MAX_LEASES:-8}
      SS_WORKER_MAX_TORRENTS: ${WORKER_MAX_TORRENTS:-12}
      SS_WORKER_ACME_CONTACT: ${WORKER_ACME_CONTACT:-}
      SS_WORKER_ACME_DIRECTORY: ${WORKER_ACME_DIRECTORY:-}
      SS_WORKER_RELAY_UPSTREAM: http://app:8080
    ports:
      - "8443:8443"
      - "${WORKER_ACME_BIND:-127.0.0.1:18081}:8081"
      - "4240:4240"
      - "4240:4240/udp"
    volumes:
      - ss-worker-data:/var/lib/ss-worker
    depends_on:
      - app

volumes:
  ss-data:
  # The worker's torrents, identity and certificates.
  ss-worker-data:
  # The collector's write-ahead log, so a restart does not drop the samples it
  # had scraped but not yet shipped.
  ss-alloy-data:
