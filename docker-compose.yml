services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    # Without a policy here the host coming back up leaves the site off the
    # air: Docker restarts and starts only the containers that carry one, so a
    # reboot took down everything except the bridge. unless-stopped rather than
    # always, so a deliberate stop during a deploy is still respected.
    restart: unless-stopped
    ports:
      - "${APP_BIND:-127.0.0.1:8099}:8080"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WEB_DIR: /web
      GIN_MODE: release
      TORRENT_BRIDGE_URL: http://torrent-bridge:8090
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_BUCKET: ${R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL}
    volumes:
      - ss-data:/data
    depends_on:
      - redis
      - livekit
      - torrent-bridge
    networks:
      - default
      - torrent-edge

  torrent-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    expose:
      - "8090"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    volumes:
      - ss-torrent-cache:/cache
    networks:
      - torrent-edge

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    # For production, set LIVEKIT_ARGS=--config /etc/livekit.yaml and add the
    # configuration through a Compose override (kept outside version control).
    command: ${LIVEKIT_ARGS:---dev}
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  ss-data:
  ss-torrent-cache:

networks:
  torrent-edge:
