services:
  app:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1:8099}:8080"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WEB_DIR: /web
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    volumes:
      - ss-data:/data
    depends_on:
      - redis
      - livekit

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    # For production, set LIVEKIT_ARGS=--config /etc/livekit.yaml and add the
    # configuration through a Compose override (kept outside version control).
    command: ${LIVEKIT_ARGS:---dev}
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  ss-data:
