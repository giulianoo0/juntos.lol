services:
  app:
    build: .
    ports:
      - "${APP_BIND:-127.0.0.1:8099}:8080"
    environment:
      REDIS_URL: redis://redis:6379
      DATA_DIR: /data
      WEB_DIR: /web
      GIN_MODE: release
      TORRENT_BRIDGE_URL: http://torrent-bridge:8090
      LIVEKIT_URL: ${LIVEKIT_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    volumes:
      - ss-data:/data
    depends_on:
      - redis
      - livekit
      - torrent-bridge
    networks:
      - default
      - torrent-edge

  torrent-bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    expose:
      - "8090"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    volumes:
      - ss-torrent-cache:/cache
    networks:
      - torrent-edge

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory-policy volatile-ttl

  livekit:
    image: livekit/livekit-server:latest
    # For production, set LIVEKIT_ARGS=--config /etc/livekit.yaml and add the
    # configuration through a Compose override (kept outside version control).
    command: ${LIVEKIT_ARGS:---dev}
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

volumes:
  ss-data:
  ss-torrent-cache:

networks:
  torrent-edge:
