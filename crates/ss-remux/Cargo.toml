[package]
name = "ss-remux"
version = "0.1.0"
edition = "2021"
description = "The remote remux for juntos.lol: FFmpeg over a loopback bridge, HLS objects PUT to the bucket, shared by ss-worker and the desktop app."

[dependencies]
ss-media = { path = "../ss-media" }
ss-torrent = { path = "../ss-torrent" }
ss-youtube = { path = "../ss-youtube" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
axum = { version = "0.7", features = ["http2"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
futures = "0.3"
bytes = "1"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
moq-net = { version = "0.2", optional = true }
moq-native = { version = "0.19", optional = true }
moq-mux = { version = "0.9", optional = true }
hang = { version = "0.20", optional = true }
url = "2"

[features]
# A YouTube live put on the MoQ relay; only the fleet worker carries it.
live = ["dep:moq-net", "dep:moq-native", "dep:moq-mux", "dep:hang"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
