[package]
name = "ss-youtube"
version = "0.1.0"
edition = "2021"
description = "A YouTube link as remux input: yt-dlp resolves it, the streams are picked and read over HTTP by ranges."

[dependencies]
ss-media = { path = "../ss-media" }
async-trait = "0.1"
anyhow = "1"
bytes = "1"
futures = "0.3"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
axum = { version = "0.7", features = ["http2"] }
