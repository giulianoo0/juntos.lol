[package]
name = "ss-torrent"
version = "0.1.0"
edition = "2021"
description = "A torrent as remux input: the piece window around the readers, the fill behind a quiet one, and the host's own session."

[dependencies]
ss-media = { path = "../ss-media" }
librqbit = { path = "../librqbit" }
async-trait = "0.1"
anyhow = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
