[package]
name = "ss-worker"
version = "0.1.0"
edition = "2021"
description = "Remote torrent worker for ss: joins the swarm, serves bytes over HTTPS Range, reports to the server."

[dependencies]
librqbit = { path = "vendor/librqbit" }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
axum = { version = "0.7", features = ["http2"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
time = "0.3"
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
instant-acme = { version = "0.8", default-features = false, features = ["hyper-rustls", "ring", "rcgen", "time", "x509-parser"] }
rcgen = "0.13"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = { version = "0.12", features = ["deadlock_detection"] }
futures = "0.3"
arc-swap = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
libc = "0.2"
url = "2"
http-body-util = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"
x509-parser = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# The throttle tests drive tokio's clock with start_paused, which "full"
# does not bring in — without this the test binary does not compile.
[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
