<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="screen" x1="600" y1="117" x2="1040" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1122"/>
      <stop offset="1" stop-color="#06080F"/>
    </linearGradient>

    <radialGradient id="warm" cx="900" cy="292" r="310" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FF7A45" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FF7A45" stop-opacity="0.09"/>
      <stop offset="1"    stop-color="#FF7A45" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scrim" x1="0" y1="425" x2="0" y2="515" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#04060C" stop-opacity="0"/>
      <stop offset="1" stop-color="#04060C" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="track" x1="871" y1="0" x2="1180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.7"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="600" y="117" width="640" height="398" rx="18"/>
    </clipPath>

    <filter id="cardShadow" x="-20%" y="-20%" width="145%" height="155%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <filter id="soft" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>

    <filter id="cursorShadow" x="-70%" y="-70%" width="260%" height="260%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g transform="rotate(-1.05 900 316)">
    <rect x="600" y="117" width="640" height="398" rx="18" fill="#06080F" filter="url(#cardShadow)"/>

    <g clip-path="url(#screenClip)">
      <rect x="600" y="117" width="640" height="398" fill="url(#screen)"/>
      <rect x="600" y="117" width="640" height="398" fill="url(#warm)"/>

      <circle cx="900" cy="292" r="106" fill="none" stroke="#FF7A45" stroke-opacity="0.26" stroke-width="2"/>
      <circle cx="900" cy="292" r="138" fill="none" stroke="#FF7A45" stroke-opacity="0.13" stroke-width="2"/>
      <circle cx="900" cy="292" r="172" fill="none" stroke="#FF7A45" stroke-opacity="0.06" stroke-width="2"/>

      <circle cx="900" cy="292" r="88" fill="#FF7A45" opacity="0.40" filter="url(#soft)"/>
      <circle cx="900" cy="292" r="76" fill="#FF7A45"/>
      <path d="M 890 266 L 924 292 L 890 318 Z" fill="#ffffff" stroke="#ffffff"
            stroke-width="12" stroke-linejoin="round"/>

      <g transform="translate(954 346) scale(1.85)" filter="url(#cursorShadow)">
        <path d="M 0 0 L 0 36.5 L 9.8 27.2 L 15.8 40.5 L 22 37.6 L 16 24.6 L 28.4 24.6 Z"
              fill="#ffffff" stroke="#0A0D14" stroke-opacity="0.9" stroke-width="2.2"
              stroke-linejoin="round"/>
      </g>

      <rect x="600" y="425" width="640" height="90" fill="url(#scrim)"/>

      <path d="M 624.3 483.3 L 631.7 488.5 L 624.3 493.7 Z" fill="#ffffff" stroke="#ffffff"
            stroke-width="3.6" stroke-linejoin="round"/>
      <rect x="871" y="487" width="369" height="4" rx="2" fill="url(#track)"/>
      <rect x="657" y="487" width="214" height="4" rx="2" fill="#FF7A45"/>
      <circle cx="871" cy="489" r="5.5" fill="#FF7A45"/>
    </g>

    <rect x="600.75" y="117.75" width="638.5" height="396.5" rx="17.25" fill="none"
          stroke="#ffffff" stroke-opacity="0.10" stroke-width="1.5"/>
  </g>
</svg>
