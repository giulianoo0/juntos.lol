    <!-- The catalog is fetched the moment the home page mounts, five rows in
         parallel, and every one of them waited on a cold handshake. -->
    <link rel="preconnect" href="https://v3-cinemeta.strem.io" />
    <link rel="dns-prefetch" href="https://images.metahub.space" />
    <!-- Lato Italic is the subtitle face (video::cue in theme.css). Only the
         italic weights are fetched: nothing else in the app uses Lato.
         Loaded without blocking the first paint: this face is only ever seen
         on a subtitle cue inside a room, and the home page — the entry point
         — cannot use it at all. `display=swap` is already set, so arriving
         late only swaps the cue text. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,400;1,700&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@1,400;1,700&display=swap" /></noscript>
