[package]
name = "juntos"
version = "0.2.3"
edition = "2021"
description = "Juntos para desktop: o site em janela própria, com torrent e YouTube preparados na máquina de quem hospeda."

[lib]
name = "juntos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
ss-remux = { path = "../../crates/ss-remux" }
librqbit = { path = "../../crates/librqbit" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-media = "0.3"
objc2-core-video = "0.3"
objc2-screen-capture-kit = "0.3"
objc2-video-toolbox = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"

# Fora do workspace da raiz: o worker e o CI de Linux não precisam do Tauri.
[workspace]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
