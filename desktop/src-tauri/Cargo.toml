[package]
name = "juntos"
version = "0.1.4"
edition = "2021"
description = "Juntos para desktop: o site em janela própria, com torrent e YouTube preparados na máquina de quem hospeda."

[lib]
name = "juntos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
ss-remux = { path = "../../crates/ss-remux" }
librqbit = { path = "../../crates/librqbit" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
rand = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"

# Fora do workspace da raiz: o worker e o CI de Linux não precisam do Tauri.
[workspace]

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 4
